{% extends "base.html" %}
{% block title %}{{ 'Crear' if action == 'create' else 'Editar' }} profesor - Sistema Escolar{% endblock %}
{% block content %}
  <div class="max-w-2xl mx-auto animate-slide-up">
    <div class="mb-6">
      <a href="{{ url_for('teachers.list_teachers') }}" class="btn-modern btn-ghost btn-sm">← Volver al listado</a>
    </div>
    <div class="card p-6">
      <h1 class="text-2xl font-semibold text-gray-900 mb-4">{{ 'Crear' if action == 'create' else 'Editar' }} profesor</h1>
      <form method="post" class="space-y-5">
        <div class="form-group">
          <label for="name" class="form-label">Nombre completo</label>
          <input id="name" type="text" name="name" value="{{ teacher.name if teacher else '' }}" class="form-input" required />
        </div>
        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico</label>
          <input id="email" type="email" name="email" value="{{ teacher.email if teacher else '' }}" class="form-input" placeholder="correo@ejemplo.com" required />
        </div>
        <div class="flex justify-end gap-3">
          <a href="{{ url_for('teachers.list_teachers') }}" class="btn-modern btn-outline">Cancelar</a>
          <button type="submit" class="btn-modern btn-primary" data-auto-loading="true">Guardar</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
