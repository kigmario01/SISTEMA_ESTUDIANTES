{% extends "base.html" %}
{% block title %}{{ 'Registrar' if action == 'create' else 'Editar' }} calificación - Sistema Escolar{% endblock %}
{% block content %}
  <div class="max-w-3xl mx-auto animate-slide-up">
    <div class="mb-6">
      <a href="{{ url_for('grades.list_grades') }}" class="btn-modern btn-ghost btn-sm">← Volver al listado</a>
    </div>
    <div class="card p-6">
      <h1 class="text-2xl font-semibold text-gray-900 mb-4">{{ 'Registrar' if action == 'create' else 'Editar' }} calificación</h1>
      <form method="post" class="grid gap-5 md:grid-cols-2">
        <div class="form-group">
          <label for="student_id" class="form-label">Estudiante</label>
          <select id="student_id" name="student_id" class="form-input" required>
            {% for s in students %}
              {% set selected = (enrollment and enrollment.student_id == s.id) %}
              <option value="{{ s.id }}" {% if selected %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="course_id" class="form-label">Curso</label>
          <select id="course_id" name="course_id" class="form-input" required>
            {% for c in courses %}
              {% set selected = (enrollment and enrollment.course_id == c.id) %}
              <option value="{{ c.id }}" {% if selected %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="teacher_id" class="form-label">Profesor</label>
          <select id="teacher_id" name="teacher_id" class="form-input" required>
            {% for t in teachers %}
              {% set selected = (enrollment and enrollment.teacher_id == t.id) %}
              <option value="{{ t.id }}" {% if selected %}selected{% endif %}>{{ t.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="grade" class="form-label">Nota (0-100)</label>
          <input id="grade" type="number" name="grade" min="0" max="100" step="0.01" value="{{ enrollment.grade if enrollment else '' }}" class="form-input" placeholder="Ej. 95" />
        </div>
        <div class="md:col-span-2 flex justify-end gap-3">
          <a href="{{ url_for('grades.list_grades') }}" class="btn-modern btn-outline">Cancelar</a>
          <button type="submit" class="btn-modern btn-primary" data-auto-loading="true">Guardar</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
