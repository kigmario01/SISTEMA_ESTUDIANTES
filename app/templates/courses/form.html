{% extends "base.html" %}
{% block content %}
  <h2>{{ 'Crear' if action == 'create' else 'Editar' }} curso</h2>
  <form method="post">
    <label>Nombre</label>
    <input type="text" name="name" value="{{ course.name if course else '' }}" required />
    <label>Descripción</label>
    <textarea name="description">{{ course.description if course else '' }}</textarea>
    <button type="submit" class="btn btn-primary" data-auto-loading="true">Guardar</button>
  </form>
{% endblock %}
