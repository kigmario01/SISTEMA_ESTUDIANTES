{% extends "base.html" %}
{% block content %}
  <h2>Reportes</h2>
  <form method="get" class="filters">
    <label>Profesor</label>
    <select name="teacher_id">
      <option value="">Todos</option>
      {% for t in teachers %}
        <option value="{{ t.id }}" {% if selected_teacher_id and selected_teacher_id|int == t.id %}selected{% endif %}>{{ t.name }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn btn-outline" data-auto-loading="true">Filtrar</button>
  </form>

  <h3>Promedio por curso</h3>
  <table>
    <thead>
      <tr><th>Curso</th><th>Promedio</th></tr>
    </thead>
    <tbody>
      {% for row in summarized %}
        <tr><td>{{ row.course }}</td><td>{{ row.avg if row.avg is not none else '—' }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
